<!DOCTYPE html>
<html>
<head>
    <title>My Fashion Designs</title>

    <style>
        body {
            background-color: lightblue;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        #products {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            max-width: 900px;
            margin: auto;
        }

        .product {
            background-color: white;
            padding: 10px;
            border-radius: 15px;
            text-align: center;
            overflow: hidden;
        }

        .product img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
            border-radius: 10px;
            cursor: pointer;
        }

        .product h2 {
            font-size: 18px;
        }

        /* BIG SCREEN */
        #imageViewer {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        #imageViewer img {
            max-width: 95%;
            max-height: 90%;
            object-fit: contain;
            border-radius: 10px;
        }

        #closeButton {
            position: absolute;
            top: 15px;
            right: 25px;
            color: white;
            font-size: 45px;
            cursor: pointer;
        }

        @media (min-width: 700px) {
            #products {
                grid-template-columns: repeat(3, 1fr);
            }
        }
    </style>
</head>

<body>

    <h1>My Fashion Designs</h1>

    <div id="products"></div>

    <!-- BIG IMAGE VIEWER -->
    <div id="imageViewer">
        <span id="closeButton">&times;</span>
        <img id="bigImage" src="" alt="Large Fashion Design">
    </div>

    <script>
        let products = document.getElementById("products");
        let imageViewer = document.getElementById("imageViewer");
        let bigImage = document.getElementById("bigImage");
        let closeButton = document.getElementById("closeButton");

        for (let i = 1; i <= 115; i++) {

            products.innerHTML += `
                <div class="product">
                    <img src="design${i}.jpg"
                         alt="Fashion Design ${i}"
                         onclick="openImage('design${i}.jpg')">

                    <h2>Fashion Design ${i}</h2>
                </div>
            `;
        }

        function openImage(imageName) {
            bigImage.src = imageName;
            imageViewer.style.display = "flex";
        }

        closeButton.onclick = function() {
            imageViewer.style.display = "none";
        };

        imageViewer.onclick = function(event) {
            if (event.target === imageViewer) {
                imageViewer.style.display = "none";
            }
        };
    </script>

</body>
</html>

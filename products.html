<!DOCTYPE html>
<html>
<head>
    <title>My Fashion Designs</title>

    <style>
        body {
            background-color: lightblue;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        #products {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            max-width: 900px;
            margin: auto;
        }

        .product {
            background-color: white;
            padding: 10px;
            border-radius: 15px;
            text-align: center;
            overflow: hidden;
        }

        .product img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
            border-radius: 10px;
        }

        .product h2 {
            font-size: 18px;
            margin: 10px 0 5px;
        }

        .price {
            font-size: 17px;
            font-weight: bold;
        }

        @media (min-width: 700px) {
            #products {
                grid-template-columns: repeat(3, 1fr);
            }
        }
    </style>
</head>

<body>

    <h1>My Fashion Designs</h1>

    <div id="products"></div>

    <script>
        let products = document.getElementById("products");

        for (let i = 1; i <= 115; i++) {

            products.innerHTML += `
                <div class="product">
                    <img src="design${i}.jpg" alt="Fashion Design ${i}">
                    <h2>Fashion Design ${i}</h2>
                    <div class="price">Contact for Price</div>
                </div>
            `;

        }
    </script>

</body>
</html>
